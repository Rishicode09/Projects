# Cloudflare Pages configuration (config-as-code).
#
# This repo is a monorepo; the TypeRush static site lives in the TypeRush/
# subfolder. There is no build step — Pages just needs to publish that folder.
# This setting overrides the dashboard "Build output directory" so the deploy
# works regardless of how the project was clicked together.
#
# (name is intentionally omitted so it inherits the connected Pages project's
#  name — avoids a name-mismatch build error.)
pages_build_output_dir = "./TypeRush"
