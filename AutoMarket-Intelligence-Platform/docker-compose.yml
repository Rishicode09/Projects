services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - app-data:/code/data-volume
    environment:
      - DATABASE_URL=sqlite:////code/data-volume/automarket.db

  dashboard:
    build: .
    command: streamlit run dashboard/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - app-data:/code/data-volume
    environment:
      - DATABASE_URL=sqlite:////code/data-volume/automarket.db
    depends_on:
      - api

volumes:
  app-data:
