[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automarket-intelligence"
version = "0.1.0"
description = "AutoMarket Intelligence Platform - used-car market analytics with ML price prediction."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rishi Mehta" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "streamlit>=1.35",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "black>=24.4",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes (undefined names, unused imports)
    "I",  # import sorting
    "B",  # bugbear (likely bugs)
    "UP", # pyupgrade (modern syntax)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
