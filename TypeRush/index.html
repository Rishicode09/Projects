<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeRush — Type Faster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f13; --bg2:#1a1a24; --bg3:#24243a;
    --text:#e0e0f0; --text-dim:#6b6b8a;
    --accent:#7c5cbf; --accent2:#a87cff; --accent3:#ff6b9d;
    --correct:#4ecca3; --wrong:#ff5577; --caret:#fff;
    --card:#1f1f2e; --border:#2d2d45; --glow:rgba(168,124,255,.35);
    --radius:12px; --line-h:2.2rem; --word-gap:10px;
    --font:'JetBrains Mono','Courier New',monospace;
  }
  [data-theme="light"] {
    --bg:#f0f0f8; --bg2:#e2e2f0; --bg3:#d0d0e8;
    --text:#1a1a2e; --text-dim:#7070a0;
    --accent:#6040b0; --accent2:#8060d0; --accent3:#d04080;
    --correct:#1a9a70; --wrong:#cc2244; --caret:#1a1a2e;
    --card:#e8e8f8; --border:#c0c0e0; --glow:rgba(96,64,176,.2);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--font);
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;overflow-x:hidden;
    transition:background .3s,color .3s;
  }

  #bg-canvas       {position:fixed;inset:0;pointer-events:none;z-index:1;}
  #particle-canvas {position:fixed;inset:0;pointer-events:none;z-index:999;}

  /* NAV */
  nav{
    width:100%;max-width:900px;padding:16px 24px;
    display:flex;align-items:center;justify-content:space-between;
    position:relative;z-index:2;
  }
  .logo{font-size:1.4rem;font-weight:700;color:var(--accent2);letter-spacing:-1px;}
  .logo span{color:var(--accent3);}
  .nav-btns{display:flex;gap:8px;align-items:center;}
  .icon-btn{
    background:var(--card);border:1px solid var(--border);
    color:var(--text-dim);border-radius:8px;padding:6px 12px;
    cursor:pointer;font-size:.95rem;transition:all .2s;font-family:var(--font);
  }
  .icon-btn:hover{color:var(--accent2);border-color:var(--accent2);}
  .icon-btn.active{color:var(--accent2);border-color:var(--accent2);}

  /* LEVEL BAR */
  #level-bar-wrap{
    width:100%;max-width:900px;padding:0 24px 10px;
    display:flex;align-items:center;gap:10px;
    font-size:.75rem;color:var(--text-dim);
    position:relative;z-index:2;
  }
  #level-label{font-weight:700;color:var(--accent2);min-width:56px;}
  .bar-track{flex:1;height:5px;background:var(--bg3);border-radius:99px;overflow:hidden;}
  #level-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;width:0%;transition:width .6s ease;}
  #xp-label{min-width:80px;text-align:right;}

  /* SCREENS */
  .screen{display:none;width:100%;max-width:900px;padding:0 24px 40px;position:relative;z-index:2;}
  .screen.active{display:block;}

  /* MENU */
  #menu-screen{text-align:center;}
  .menu-title{
    font-size:2.8rem;font-weight:700;margin-bottom:4px;
    background:linear-gradient(135deg,var(--accent2),var(--accent3));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .menu-sub{color:var(--text-dim);font-size:.9rem;margin-bottom:28px;}

  .mode-tabs{display:flex;justify-content:center;gap:0;margin-bottom:24px;border:1px solid var(--border);border-radius:10px;overflow:hidden;width:fit-content;margin-left:auto;margin-right:auto;}
  .mode-tab{
    padding:9px 28px;cursor:pointer;font-family:var(--font);
    font-size:.9rem;font-weight:600;color:var(--text-dim);
    background:var(--card);border:none;transition:all .2s;
  }
  .mode-tab.active{background:var(--accent);color:#fff;}

  .option-label{display:block;color:var(--text-dim);font-size:.72rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  .option-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .opt-btn{
    background:var(--card);border:2px solid var(--border);
    color:var(--text-dim);border-radius:8px;padding:7px 18px;
    cursor:pointer;font-family:var(--font);font-size:.88rem;font-weight:600;transition:all .2s;
  }
  .opt-btn:hover{border-color:var(--accent);color:var(--text);}
  .opt-btn.selected{border-color:var(--accent2);color:var(--accent2);background:var(--bg3);box-shadow:0 0 10px var(--glow);}
  .opt-btn.toggle.on{border-color:var(--accent3);color:var(--accent3);background:var(--bg3);}

  /* STORY GRID */
  #story-panel{display:none;}
  #story-panel.visible{display:block;}
  #words-panel{display:block;}
  #words-panel.hidden{display:none;}

  .story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
  .story-card{
    background:var(--card);border:2px solid var(--border);border-radius:10px;
    padding:16px 12px;cursor:pointer;text-align:center;transition:all .2s;
  }
  .story-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .story-card.selected{border-color:var(--accent2);box-shadow:0 0 12px var(--glow);}
  .story-icon{font-size:2rem;margin-bottom:6px;}
  .story-title{font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:2px;}
  .story-author{font-size:.7rem;color:var(--text-dim);}

  #play-btn{
    display:block;margin:4px auto 24px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;font-family:var(--font);
    font-size:1rem;font-weight:700;letter-spacing:1px;
    padding:13px 44px;border-radius:10px;cursor:pointer;
    transition:transform .15s,box-shadow .2s;
    box-shadow:0 4px 20px rgba(124,92,191,.4);
  }
  #play-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,92,191,.55);}

  /* HISTORY SPARKLINE */
  #history-wrap{margin-bottom:20px;}
  #sparkline-canvas{width:100%;height:48px;display:block;border-radius:8px;cursor:default;}

  /* SCORES */
  .scores-grid{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:8px;}
  .score-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;min-width:110px;text-align:center;}
  .score-card .sc-label{font-size:.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}
  .score-card .sc-val{font-size:1.4rem;font-weight:700;color:var(--accent2);margin:3px 0 2px;}
  .score-card .sc-sub{font-size:.72rem;color:var(--text-dim);}

  /* GAME: LIVE */
  #game-live{transition:opacity .3s ease;}
  #game-live.fading{opacity:0;pointer-events:none;}

  .hud{display:flex;justify-content:space-between;align-items:center;padding:10px 0 14px;flex-wrap:wrap;gap:8px;}
  .hud-stat{display:flex;flex-direction:column;align-items:center;min-width:64px;}
  .hud-val{font-size:1.75rem;font-weight:700;color:var(--accent2);line-height:1;}
  .hud-sub{font-size:.62rem;color:var(--text-dim);margin-top:1px;}
  .hud-label{font-size:.63rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}

  #timer-ring-wrap{position:relative;width:68px;height:68px;display:flex;align-items:center;justify-content:center;}
  #timer-ring{position:absolute;inset:0;transform:rotate(-90deg);}
  #timer-ring circle{fill:none;}
  #timer-bg{stroke:var(--bg3);stroke-width:5;}
  #timer-arc{stroke:var(--accent2);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  #timer-text{font-size:1.3rem;font-weight:700;color:var(--accent2);z-index:1;}

  /* COMBO */
  #combo-area{text-align:center;margin-bottom:8px;}
  #combo-label{font-size:.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}
  #combo-val{font-size:1.9rem;font-weight:700;color:var(--accent3);display:inline-block;}
  #combo-val.pop{animation:comboPop .18s ease;}
  @keyframes comboPop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
  .combo-bar-track{width:100%;height:4px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:4px;}
  #combo-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent3),#ffaa44);border-radius:99px;width:0%;transition:width .3s ease;}

  /* CAPS / STRICT NOTICES */
  .game-notices{display:flex;justify-content:center;gap:12px;min-height:20px;margin-bottom:6px;}
  .notice{font-size:.72rem;font-weight:700;letter-spacing:.5px;padding:2px 10px;border-radius:99px;display:none;}
  .notice.visible{display:inline-block;}
  #caps-notice{background:rgba(255,85,119,.15);color:var(--wrong);border:1px solid rgba(255,85,119,.3);}
  #strict-notice{background:rgba(255,107,157,.1);color:var(--accent3);border:1px solid rgba(255,107,157,.25);}

  /* WORD AREA — 3-row window */
  #word-area{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:20px;
    height:calc(3 * var(--line-h) + 2 * var(--word-gap) + 40px);
    overflow:hidden;position:relative;
    margin-bottom:0;transition:box-shadow .3s;cursor:text;
  }
  #word-area.glow{box-shadow:0 0 28px var(--glow);}
  #word-area.shake{animation:shake .25s ease;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  /* Row highlight */
  #row-highlight{
    position:absolute;left:20px;right:20px;
    background:rgba(168,124,255,.05);border-radius:4px;
    pointer-events:none;transition:top .25s ease;
    z-index:0;
  }
  [data-theme="light"] #row-highlight{background:rgba(96,64,176,.06);}

  #words-container{
    font-size:1.45rem;line-height:var(--line-h);
    user-select:none;display:flex;flex-wrap:wrap;
    gap:var(--word-gap) 10px;
    will-change:transform;transition:transform .25s ease;
    position:relative;z-index:1;
  }
  .word{display:flex;position:relative;}
  .word.strict-error::after{
    content:'';position:absolute;inset:-2px;border-radius:4px;
    border:2px solid var(--wrong);pointer-events:none;
  }
  .char{color:var(--text-dim);position:relative;transition:color .06s;}
  .char.correct{color:var(--correct);}
  .char.wrong{color:var(--wrong);}

  /* Smooth caret */
  #smooth-caret{
    position:absolute;width:2px;
    background:var(--caret);border-radius:1px;
    pointer-events:none;z-index:2;
    transition:left .05s ease,top .12s ease;
    animation:caretBlink 1s steps(1) infinite;
  }
  #smooth-caret.instant{transition:none;}
  @keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}

  #hidden-input{position:absolute;left:-9999px;top:0;opacity:0;pointer-events:none;}

  /* Focus / AFK overlay */
  #focus-overlay{
    position:absolute;inset:0;border-radius:var(--radius);
    background:rgba(15,15,19,.82);backdrop-filter:blur(4px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;
  }
  [data-theme="light"] #focus-overlay{background:rgba(240,240,248,.85);}
  #focus-overlay.visible{opacity:1;pointer-events:all;cursor:pointer;}
  #fo-icon{font-size:1.6rem;}
  #fo-text{color:var(--text-dim);font-size:.85rem;}

  /* Game footer */
  .game-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  #restart-hint{font-size:.74rem;color:var(--text-dim);}
  kbd{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-family:var(--font);font-size:.72rem;}
  #restart-btn{
    background:var(--card);border:1px solid var(--border);
    color:var(--text-dim);border-radius:8px;padding:5px 12px;
    cursor:pointer;font-size:1.05rem;transition:all .2s;
    font-family:var(--font);
  }
  #restart-btn:hover{color:var(--accent2);border-color:var(--accent2);}

  /* INLINE RESULTS */
  #game-results{display:none;}
  #game-results.show{display:block;animation:resultsIn .4s ease forwards;}
  @keyframes resultsIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .results-title{font-size:1.5rem;font-weight:700;margin-bottom:16px;color:var(--accent2);}
  .results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px;}
  .result-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
  .result-card .r-label{font-size:.66rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}
  .result-card .r-val{font-size:1.8rem;font-weight:700;color:var(--accent2);margin:3px 0 0;}
  .result-card .r-unit{font-size:.7rem;color:var(--text-dim);}
  .result-card.highlight{border-color:var(--accent2);box-shadow:0 0 14px var(--glow);}

  #chart-canvas{width:100%;height:150px;background:var(--card);border:1px solid var(--border);border-radius:10px;display:block;margin-bottom:14px;}

  .trouble-section{margin-bottom:16px;}
  .trouble-section h3{font-size:.74rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  #trouble-keys{display:flex;flex-wrap:wrap;gap:7px;}
  .tkey{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 9px;text-align:center;}
  .tkey .tk-char{font-size:1rem;font-weight:700;color:var(--wrong);}
  .tkey .tk-count{font-size:.62rem;color:var(--text-dim);margin-top:1px;}

  .results-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .action-btn{
    flex:1;min-width:110px;padding:11px 20px;border-radius:10px;
    font-family:var(--font);font-size:.9rem;font-weight:700;
    cursor:pointer;border:2px solid var(--accent);transition:all .2s;
  }
  .action-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(124,92,191,.4);}
  .action-btn.primary:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(124,92,191,.55);}
  .action-btn.secondary{background:transparent;color:var(--text-dim);}
  .action-btn.secondary:hover{border-color:var(--accent2);color:var(--text);}
  .action-btn.share{background:transparent;color:var(--accent3);border-color:var(--accent3);}
  .action-btn.share:hover{background:rgba(255,107,157,.08);}

  /* TOASTS */
  #toast-area{position:fixed;top:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:1000;pointer-events:none;width:min(340px,calc(100vw - 40px));}
  .toast{background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:11px 14px;box-shadow:0 4px 20px rgba(0,0,0,.5);animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;display:flex;align-items:center;gap:9px;}
  @keyframes toastIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
  @keyframes toastOut{from{opacity:1}to{opacity:0}}
  .toast-icon{font-size:1.3rem;}
  .toast-title{font-weight:700;color:var(--accent2);font-size:.85rem;}
  .toast-sub{color:var(--text-dim);font-size:.74rem;}

  /* LEVEL-UP FLASH */
  #levelup-flash{position:fixed;inset:0;z-index:998;background:radial-gradient(ellipse at center,rgba(168,124,255,.28),transparent 70%);pointer-events:none;opacity:0;transition:opacity .3s;}
  #levelup-flash.show{opacity:1;}
  body.milestone{animation:milestoneBody .6s ease;}
  @keyframes milestoneBody{0%,100%{background:var(--bg)}50%{background:color-mix(in srgb,var(--bg) 80%,var(--accent2));}}

  /* RESPONSIVE */
  @media(max-width:600px){
    #words-container{font-size:1.2rem;}
    .menu-title{font-size:2.1rem;}
    .hud-val{font-size:1.4rem;}
    #word-area{height:calc(3*1.9rem + 2*var(--word-gap) + 40px);}
    .story-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  }
</style>
</head>
<body data-theme="dark">

<canvas id="bg-canvas"></canvas>
<canvas id="particle-canvas"></canvas>
<div id="levelup-flash"></div>
<div id="toast-area"></div>

<nav>
  <div class="logo">Type<span>Rush</span></div>
  <div class="nav-btns">
    <button class="icon-btn" id="theme-btn">☀️</button>
    <button class="icon-btn active" id="sound-btn">🔊</button>
  </div>
</nav>

<div id="level-bar-wrap">
  <span id="level-label">Lvl 1</span>
  <div class="bar-track"><div id="level-fill"></div></div>
  <span id="xp-label">0 XP</span>
</div>

<!-- ══ MENU ══ -->
<div id="menu-screen" class="screen active">
  <div class="menu-title">TypeRush</div>
  <div class="menu-sub">Train your fingers. Break your records.</div>

  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="words">Words</button>
    <button class="mode-tab" data-mode="stories">Stories</button>
  </div>

  <!-- WORDS CONFIG -->
  <div id="words-panel">
    <span class="option-label">Duration</span>
    <div class="option-row" id="duration-opts">
      <button class="opt-btn selected" data-val="15">15s</button>
      <button class="opt-btn" data-val="30">30s</button>
      <button class="opt-btn" data-val="60">60s</button>
    </div>
    <span class="option-label">Difficulty</span>
    <div class="option-row" id="difficulty-opts">
      <button class="opt-btn selected" data-val="easy">Easy</button>
      <button class="opt-btn" data-val="medium">Medium</button>
      <button class="opt-btn" data-val="hard">Hard</button>
    </div>
    <span class="option-label">Modifiers</span>
    <div class="option-row">
      <button class="opt-btn toggle" id="numbers-btn">123 Numbers</button>
      <button class="opt-btn toggle" id="punct-btn">., Punctuation</button>
      <button class="opt-btn toggle" id="strict-btn">⚠ Strict</button>
    </div>
  </div>

  <!-- STORY CONFIG -->
  <div id="story-panel">
    <span class="option-label">Choose a Story</span>
    <div class="story-grid" id="story-grid"></div>
    <span class="option-label">Duration</span>
    <div class="option-row" id="story-duration-opts">
      <button class="opt-btn" data-val="30">30s</button>
      <button class="opt-btn selected" data-val="60">60s</button>
      <button class="opt-btn" data-val="120">120s</button>
    </div>
  </div>

  <button id="play-btn">▶  PLAY</button>

  <div id="history-wrap" style="display:none">
    <span class="option-label" style="text-align:center;display:block;margin-bottom:8px;">Recent WPM</span>
    <canvas id="sparkline-canvas"></canvas>
  </div>

  <span class="option-label" style="display:block;text-align:center;margin-bottom:10px;margin-top:6px;">Personal Bests</span>
  <div class="scores-grid" id="scores-grid"></div>
</div>

<!-- ══ GAME ══ -->
<div id="game-screen" class="screen">

  <div id="game-live">
    <div class="hud">
      <div class="hud-stat">
        <span class="hud-val" id="wpm-val">---</span>
        <span class="hud-sub" id="raw-wpm-sub">raw ---</span>
        <span class="hud-label">WPM</span>
      </div>
      <div class="hud-stat">
        <span class="hud-val" id="acc-val">---</span>
        <span class="hud-label">Accuracy %</span>
      </div>
      <div id="timer-ring-wrap">
        <svg id="timer-ring" viewBox="0 0 72 72">
          <circle id="timer-bg" cx="36" cy="36" r="31"/>
          <circle id="timer-arc" cx="36" cy="36" r="31" stroke-dasharray="194.78" stroke-dashoffset="0"/>
        </svg>
        <span id="timer-text">--</span>
      </div>
      <div class="hud-stat">
        <span class="hud-val" id="score-val">0</span>
        <span class="hud-label">Score</span>
      </div>
      <div class="hud-stat">
        <span class="hud-val" id="chars-val">0</span>
        <span class="hud-label">Chars</span>
      </div>
    </div>

    <div id="combo-area">
      <div id="combo-label">Combo</div>
      <div id="combo-val">×1</div>
      <div class="combo-bar-track"><div id="combo-bar-fill"></div></div>
    </div>

    <div class="game-notices">
      <span class="notice" id="caps-notice">⇪ CAPS LOCK ON</span>
      <span class="notice" id="strict-notice">⚠ Strict Mode</span>
    </div>

    <div id="word-area">
      <div id="row-highlight"></div>
      <div id="words-container"></div>
      <div id="smooth-caret"></div>
      <input id="hidden-input" type="text" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false"
             inputmode="text">
      <div id="focus-overlay">
        <div id="fo-icon">⌨️</div>
        <div id="fo-text">Click to focus</div>
      </div>
    </div>

    <div class="game-footer">
      <div id="restart-hint"><kbd>Tab</kbd> restart · <kbd>Esc</kbd> menu</div>
      <button id="restart-btn" title="Restart (Tab)">↻</button>
    </div>
  </div>

  <!-- Inline results -->

function drawOrbs(){
  bgX.clearRect(0,0,bgC.width,bgC.height);
  const dk=document.body.dataset.theme==='dark';
  const cl=dk?['168,124,255','255,107,157','78,204,163']:['96,64,176','208,64,128','26,154,112'];
  orbs.forEach(o=>{
    o.x+=o.vx;o.y+=o.vy;o.ph+=o.ps;
    if(o.x<-o.r)o.x=bgC.width+o.r;if(o.x>bgC.width+o.r)o.x=-o.r;
    if(o.y<-o.r)o.y=bgC.height+o.r;if(o.y>bgC.height+o.r)o.y=-o.r;
    const r=o.r*(1+.12*Math.sin(o.ph));
    const g=bgX.createRadialGradient(o.x,o.y,0,o.x,o.y,r);
    g.addColorStop(0,`rgba(${cl[o.ci]},${o.op})`);g.addColorStop(1,`rgba(${cl[o.ci]},0)`);
    bgX.beginPath();bgX.arc(o.x,o.y,r,0,Math.PI*2);bgX.fillStyle=g;bgX.fill();
  });
}

}

// ── WORD GENERATION ───────────────────────────────────────────────────────────
function generateWords(count,recentSeed=[]){
  const list=getWordList(S.difficulty);
  const words=[],ws=Math.min(8,Math.floor(list.length/2));
  const recent=recentSeed.slice(-ws);
  for(let i=0;i<count;i++){
    let base,att=0;
    do{base=list[Math.floor(Math.random()*list.length)];att++;}
    while(recent.includes(base)&&att<30);
    let word=base;
    if(S.useNumbers&&Math.random()<.12) word=String(Math.floor(Math.random()*900)+100);
    else if(S.usePunctuation&&Math.random()<.28) word=base+(Math.random()<.6?',':'.');
    words.push(word);recent.push(base);if(recent.length>ws)recent.shift();
  }
  return words;
}

function getStoryWords(id){
  const story=STORIES[id];
  if(!story) return generateWords(200);
  return story.text.split(/\s+/).filter(Boolean);
}

function getRowH(){
  for(const w of wContainer.querySelectorAll('.word')){if(w.offsetTop>0)return w.offsetTop;}
  return null;
}
function scrollWords(){
  const el=getWordEl(S.wordIndex);if(!el)return;

  const row=Math.round(el.offsetTop/lh);
  const scroll=Math.max(0,row-1)*lh;
  wContainer.style.transform=`translateY(-${scroll}px)`;
  updateRowHighlight(row,lh,scroll);
}

function updateRowHighlight(currentRow,lineH,scrolled){
  const hl=document.getElementById('row-highlight');
  if(!hl||!lineH)return;
  const visRow=(currentRow===undefined)?0:currentRow-Math.max(0,currentRow-1);
  const pad=20;
  hl.style.top=(pad+visRow*lineH)+'px';
  hl.style.height=lineH+'px';
}

function updateCaret(){
  const caret=document.getElementById('smooth-caret');
  if(!caret||S.screen!=='game') return;
  const wordEl=getWordEl(S.wordIndex);
  if(!wordEl){caret.style.opacity='0';return;}
  const chars=wordEl.querySelectorAll('.char');
  const target=chars[S.charIndex]||(chars.length?chars[chars.length-1]:null);
  if(!target){caret.style.opacity='0';return;}
  caret.style.opacity='1';
  const cr=wContainer.getBoundingClientRect();
  const tr=target.getBoundingClientRect();
  const leftOff=chars[S.charIndex]?0:tr.width;
  caret.style.left=(tr.left-cr.left+leftOff)+'px';
  caret.style.top=(tr.top-cr.top)+'px';
  caret.style.height=tr.height+'px';
}

  clearTimeout(S.afkTimer);
  clearInterval(S.timerId);S.timerId=null;

  S.words=S.gameMode==='story'?getStoryWords(S.storyId):generateWords(200);

  buildWordDom();
  wContainer.style.transform='';
  // init row highlight position
  setTimeout(()=>{const lh=getRowH();updateRowHighlight(1,lh||40,0);},50);

  const live=document.getElementById('game-live');
  const res=document.getElementById('game-results');
  live.classList.remove('fading');live.style.display='';
  res.classList.remove('show');

  document.querySelectorAll('.word.strict-error').forEach(e=>e.classList.remove('strict-error'));

  updateHUD();updateCombo();
  setTimerRing(S.duration,S.duration);
  document.getElementById('timer-text').textContent=S.duration;
  document.getElementById('strict-notice').classList.toggle('visible',S.stopOnError);

  const caret=document.getElementById('smooth-caret');
  if(caret){caret.classList.add('instant');caret.style.opacity='0';setTimeout(()=>{caret.classList.remove('instant');},50);}

  hiddenInput.value='';hiddenInput.focus();
  wordArea.classList.remove('glow','shake');
  hideOverlay();
}

function timerTick(){
  S.timeLeft--;
  updateHUD();
  setTimerRing(S.timeLeft,S.duration);
  if(S.timeLeft>0){
    const el=S.duration-S.timeLeft;
    const wpm=Math.round((S.correctChars/5)/(el/60));
    S.wpmSamples.push({t:el,wpm});
  }
  if(S.timeLeft<=0)endGame();
}

function startTimer(){
  S.started=true;
  S.timerId=setInterval(timerTick,1000);
  resetAfk();
}

function endGame(){
  clearInterval(S.timerId);S.timerId=null;
  clearTimeout(S.afkTimer);
  S.finished=true;
  const el=S.duration;
  const wpm=Math.round((S.correctChars/5)/(el/60));
  const rawWpm=Math.round((S.rawChars/5)/(el/60));
  const accuracy=S.totalTyped>0?Math.round((S.correctChars/S.totalTyped)*100):100;
  const bestKey=`${S.duration}-${S.gameMode==='story'?S.storyId:S.difficulty}`;
  const isNew=!S.bests[bestKey]||wpm>S.bests[bestKey].wpm;
  if(isNew) S.bests[bestKey]={wpm,acc:accuracy,score:S.score};
  S.totalRuns++;
  S.history.unshift({wpm,acc:accuracy,ts:Date.now()});
  if(S.history.length>20)S.history.pop();
  const xpGained=Math.round(S.score/10)+wpm*2;
  awardXP(xpGained);
  checkAchievements({wpm,accuracy,maxCombo:S.maxCombo,isStory:S.gameMode==='story'});
  savePersisted();
  showResultsInline({wpm,rawWpm,accuracy,isNew,xpGained});
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
hiddenInput.addEventListener('keydown',e=>{
  if(S.finished)return;
  if(e.key==='Tab'){e.preventDefault();initGame();return;}
  if(e.key==='Escape'){e.preventDefault();clearInterval(S.timerId);showScreen('menu');refreshMenu();return;}

  // Caps lock badge
  const caps=e.getModifierState&&e.getModifierState('CapsLock');
  document.getElementById('caps-notice').classList.toggle('visible',!!caps);

  // Backspace to previous word
  if(e.key==='Backspace'&&hiddenInput.value===''&&S.wordIndex>0&&S.started){
    e.preventDefault();
    const prev=S.submittedWords.pop();
    if(!prev)return;
    S.wordIndex--;
    hiddenInput.value=prev.typed;
    S.charIndex=prev.typed.length;
    if(prev.correct) S.correctChars=Math.max(0,S.correctChars-(prev.expected.length+1));
    S.totalTyped=Math.max(0,S.totalTyped-prev.typed.length);
    // re-render prev word chars
    const wordEl=getWordEl(S.wordIndex);
    if(wordEl){
      const prevWord=S.words[S.wordIndex];
      wordEl.querySelectorAll('.char').forEach((ch,ci)=>{
        ch.classList.remove('correct','wrong');
        if(ci<prev.typed.length) ch.classList.add(prev.typed[ci]===prevWord[ci]?'correct':'wrong');
      });
    }
    scrollWords();updateCaret();updateHUD();
    return;
  }

  if(!S.started&&e.key.length===1){startTimer();}
  resetAfk();
});

hiddenInput.addEventListener('input',()=>{
  if(S.finished)return;
  const val=hiddenInput.value;
  const curWord=S.words[S.wordIndex];
  if(!curWord)return;

  const prevLen=(S.typedChars[S.wordIndex]||'').length;
  const newLen=val.endsWith(' ')?val.length-1:val.length;
  if(newLen>prevLen) S.rawChars+=(newLen-prevLen);

  if(val.endsWith(' ')){
    const typed=val.trimEnd();
    if(S.stopOnError&&typed!==curWord){
      hiddenInput.value=typed;
      wordArea.classList.add('shake');playClick('error');
      const we=getWordEl(S.wordIndex);
      if(we)we.classList.add('strict-error');
      setTimeout(()=>wordArea.classList.remove('shake'),300);
      return;
    }
    const we=getWordEl(S.wordIndex);
    if(we)we.classList.remove('strict-error');
    submitWord(typed);
    hiddenInput.value='';
    return;
  }

  S.typedChars[S.wordIndex]=val;S.charIndex=val.length;
  const we=getWordEl(S.wordIndex);
  if(!we)return;
  we.querySelectorAll('.char').forEach((ch,ci)=>{
    ch.classList.remove('correct','wrong');
    if(ci<val.length){
      const ok=val[ci]===curWord[ci];
      ch.classList.add(ok?'correct':'wrong');
      if(!ok&&val[ci]!==undefined) S.perKeyErrors[curWord[ci]]=(S.perKeyErrors[curWord[ci]]||0)+1;
    }
  });
  updateCaret();playClick('key');resetAfk();
});

// ── SUBMIT WORD ───────────────────────────────────────────────────────────────
function submitWord(typed){
  const expected=S.words[S.wordIndex];
  const isCorrect=typed===expected;
  S.totalTyped+=typed.length;
  S.submittedWords.push({typed,expected,correct:isCorrect});

  if(isCorrect){
    S.correctChars+=expected.length+1;
    // combo decay on half (not zero) — already not wrong here, just increment
    S.combo++;
    if(S.combo>S.maxCombo)S.maxCombo=S.combo;
    const mult=comboMult();
    S.score+=expected.length*mult*10;
    playClick('word');
    const we=getWordEl(S.wordIndex);
    if(we){const r=we.getBoundingClientRect();spawnParts(r.left+r.width/2,r.top+r.height/2,'#4ecca3');spawnParts(r.left+r.width/2,r.top+r.height/2,'#a87cff');}
    if([10,25,50,100].includes(S.combo)){
      wordArea.classList.add('glow');document.body.classList.add('milestone');
      toast('🔥',`${S.combo}× Combo!`,`Multiplier ×${mult.toFixed(1)}`);
      setTimeout(()=>{wordArea.classList.remove('glow');document.body.classList.remove('milestone');},1000);
    }
  } else {
    for(let i=0;i<expected.length;i++)
      if((typed[i]||'')!==expected[i]) S.perKeyErrors[expected[i]]=(S.perKeyErrors[expected[i]]||0)+1;
    // combo HALVED (not zeroed) — more forgiving
    S.combo=Math.floor(S.combo/2);
    wordArea.classList.add('shake');setTimeout(()=>wordArea.classList.remove('shake'),300);
    playClick('error');
  }

  // mark word done in DOM
  const we=getWordEl(S.wordIndex);
  if(we) we.querySelectorAll('.char').forEach((ch,ci)=>{
    ch.classList.remove('correct','wrong');
    if(ci<typed.length) ch.classList.add(typed[ci]===expected[ci]?'correct':'wrong');
  });

  S.wordIndex++;S.charIndex=0;

  // story mode: end when all words typed
  if(S.gameMode==='story'&&S.wordIndex>=S.words.length){endGame();return;}

  // extend random word list
  if(S.gameMode==='words'&&S.wordIndex+20>S.words.length){
    const extra=generateWords(50,S.words.slice(-8));
    const base=S.words.length;S.words.push(...extra);
    extra.forEach((w,i)=>wContainer.appendChild(makeWordEl(w,base+i)));
  }

  updateCaret();updateHUD();updateCombo();scrollWords();
}

function comboMult(){
  if(S.combo>=50)return 4;if(S.combo>=25)return 3;
  if(S.combo>=10)return 2;if(S.combo>=5)return 1.5;return 1;
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD(){
  const el=S.duration-S.timeLeft;
  const warmup=el<3;
  const wpm=(!warmup&&el>0)?Math.round((S.correctChars/5)/(el/60)):null;
  const raw=(!warmup&&el>0)?Math.round((S.rawChars/5)/(el/60)):null;
  const acc=S.totalTyped>0?Math.round((S.correctChars/S.totalTyped)*100):null;
  document.getElementById('wpm-val').textContent=wpm!==null?wpm:'---';
  document.getElementById('raw-wpm-sub').textContent=raw!==null?`raw ${raw}`:'raw ---';
  document.getElementById('acc-val').textContent=acc!==null?acc:'---';
  document.getElementById('timer-text').textContent=S.timeLeft;
  document.getElementById('score-val').textContent=S.score;
  document.getElementById('chars-val').textContent=S.correctChars;
}

const ARC=2*Math.PI*31;
function setTimerRing(left,total){
  const arc=document.getElementById('timer-arc'),pct=left/total;
  arc.style.strokeDashoffset=ARC*(1-pct);
  arc.style.stroke=pct<.25?'var(--accent3)':pct<.5?'#ffa84c':'var(--accent2)';
}
function updateCombo(){
  const el=document.getElementById('combo-val');
  el.textContent=`×${comboMult().toFixed(1)}`;
  el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
  document.getElementById('combo-bar-fill').style.width=Math.min(100,(S.combo/50)*100)+'%';
}

// ── INLINE RESULTS ────────────────────────────────────────────────────────────
function showResultsInline({wpm,rawWpm,accuracy,isNew,xpGained}){
  const live=document.getElementById('game-live');
  const res=document.getElementById('game-results');
  live.classList.add('fading');
  setTimeout(()=>{
    live.style.display='none';
    if(isNew)toast('🏆','New Personal Best!',`${wpm} WPM`);
    document.getElementById('results-headline').textContent=isNew?'🏆 New Personal Best!':'Results';
    const con=calcConsistency();
    const grid=document.getElementById('results-grid');grid.innerHTML='';
    [
      {label:'WPM',val:wpm,unit:'words/min',hi:true},
      {label:'Raw WPM',val:rawWpm,unit:'incl. errors'},
      {label:'Accuracy',val:accuracy,unit:'%'},
      {label:'Consistency',val:con,unit:'%'},
      {label:'Score',val:S.score,unit:'pts'},
      {label:'Best Combo',val:S.maxCombo,unit:'words'},
      {label:'XP Gained',val:xpGained,unit:'xp'},
    ].forEach(s=>{
      const c=document.createElement('div');
      c.className='result-card'+(s.hi?' highlight':'');
      c.innerHTML=`<div class="r-label">${s.label}</div><div class="r-val" data-target="${s.val}">0</div><div class="r-unit">${s.unit}</div>`;
      grid.appendChild(c);
    });
    grid.querySelectorAll('.r-val[data-target]').forEach(el=>{
      const t=parseInt(el.dataset.target);if(isNaN(t))return;
      let st=null;
      const step=ts=>{if(!st)st=ts;const p=Math.min((ts-st)/800,1);el.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);};
      requestAnimationFrame(step);
    });
    drawChart();renderTroubleKeys();

    // wire share button with current stats
    document.getElementById('share-btn').onclick=()=>shareScore(wpm,accuracy);
    res.classList.add('show');
  },320);
}

function calcConsistency(){
  if(S.wpmSamples.length<2)return 100;
  const v=S.wpmSamples.map(s=>s.wpm),avg=v.reduce((a,b)=>a+b,0)/v.length;
  const sd=Math.sqrt(v.reduce((a,b)=>a+(b-avg)**2,0)/v.length);
  return Math.max(0,Math.round(100-(sd/(avg||1))*100));
}

function drawChart(){
  const canvas=document.getElementById('chart-canvas');
  const dpr=window.devicePixelRatio||1,W=canvas.offsetWidth,H=150;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const s=S.wpmSamples,pad={t:14,r:14,b:26,l:40},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const dk=document.body.dataset.theme==='dark';
  ctx.fillStyle=dk?'#1f1f2e':'#e8e8f8';ctx.roundRect(0,0,W,H,10);ctx.fill();
  if(s.length<2){ctx.fillStyle=dk?'#6b6b8a':'#7070a0';ctx.font='12px JetBrains Mono,monospace';ctx.textAlign='center';ctx.fillText('Not enough data',W/2,H/2);return;}
  const mx=Math.max(...s.map(x=>x.wpm),1),mn=Math.max(0,Math.min(...s.map(x=>x.wpm))-5);
  const tx=t=>pad.l+(t/S.duration)*cw,ty=w=>pad.t+ch-((w-mn)/(mx-mn+1))*ch;
  ctx.strokeStyle=dk?'#2d2d45':'#c0c0e0';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pad.t+(ch/4)*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();ctx.fillStyle=dk?'#6b6b8a':'#7070a0';ctx.font='9px JetBrains Mono,monospace';ctx.textAlign='right';ctx.fillText(Math.round(mx-(mx-mn)*(i/4)),pad.l-5,y+3);}
  [0,S.duration/2,S.duration].forEach(t=>{ctx.fillStyle=dk?'#6b6b8a':'#7070a0';ctx.font='9px JetBrains Mono,monospace';ctx.textAlign='center';ctx.fillText(t+'s',tx(t),H-7);});
  const g=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);g.addColorStop(0,'rgba(168,124,255,.4)');g.addColorStop(1,'rgba(168,124,255,0)');
  ctx.beginPath();ctx.moveTo(tx(s[0].t),ty(s[0].wpm));s.forEach(x=>ctx.lineTo(tx(x.t),ty(x.wpm)));ctx.lineTo(tx(s.at(-1).t),pad.t+ch);ctx.lineTo(tx(s[0].t),pad.t+ch);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.moveTo(tx(s[0].t),ty(s[0].wpm));s.forEach(x=>ctx.lineTo(tx(x.t),ty(x.wpm)));ctx.strokeStyle='#a87cff';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  s.forEach(x=>{ctx.beginPath();ctx.arc(tx(x.t),ty(x.wpm),3,0,Math.PI*2);ctx.fillStyle='#a87cff';ctx.fill();});
}

function renderTroubleKeys(){
  const cont=document.getElementById('trouble-keys');cont.innerHTML='';
  const sorted=Object.entries(S.perKeyErrors).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(!sorted.length){cont.innerHTML='<span style="color:var(--correct);font-size:.85rem">No trouble keys — great job!</span>';return;}
  sorted.forEach(([ch,n])=>{const el=document.createElement('div');el.className='tkey';el.innerHTML=`<div class="tk-char">${ch===' '?'␣':ch}</div><div class="tk-count">${n}×</div>`;cont.appendChild(el);});
}

// ── SHARE ─────────────────────────────────────────────────────────────────────
function shareScore(wpm,accuracy){
  const mode=S.gameMode==='story'?STORIES[S.storyId]?.title:S.difficulty;
  const text=`I typed ${wpm} WPM with ${accuracy}% accuracy on TypeRush! (${S.duration}s · ${mode}) 🚀 typerush`;
  navigator.clipboard?.writeText(text).then(()=>toast('📋','Copied to clipboard!',text)).catch(()=>toast('📋','Your score:',text));
}

// ── SPARKLINE ─────────────────────────────────────────────────────────────────
function drawSparkline(){
  const wrap=document.getElementById('history-wrap');
  const h=S.history.filter(x=>x.wpm>0);
  if(h.length<2){wrap.style.display='none';return;}
  wrap.style.display='block';
  const canvas=document.getElementById('sparkline-canvas');
  const dpr=window.devicePixelRatio||1,W=canvas.offsetWidth||700,H=48;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const rev=[...h].reverse();
  const vals=rev.map(x=>x.wpm);
  const mx=Math.max(...vals),mn=Math.max(0,Math.min(...vals)-5);
  const tx=i=>(i/(rev.length-1))*W;
  const ty=v=>H-4-((v-mn)/(mx-mn+1))*(H-8);
  const dk=document.body.dataset.theme==='dark';
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(168,124,255,.3)');g.addColorStop(1,'rgba(168,124,255,0)');
  ctx.beginPath();ctx.moveTo(tx(0),ty(vals[0]));vals.forEach((v,i)=>ctx.lineTo(tx(i),ty(v)));ctx.lineTo(tx(vals.length-1),H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.moveTo(tx(0),ty(vals[0]));vals.forEach((v,i)=>ctx.lineTo(tx(i),ty(v)));ctx.strokeStyle='#a87cff';ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();
  // first and last label
  ctx.fillStyle=dk?'#a87cff':'#8060d0';ctx.font='bold 10px JetBrains Mono,monospace';ctx.textAlign='left';ctx.fillText(vals[0]+' WPM',4,12);
  ctx.textAlign='right';ctx.fillText(vals[vals.length-1]+' WPM',W-4,12);
}

// ── MENU ──────────────────────────────────────────────────────────────────────
function buildStoryGrid(){
  const grid=document.getElementById('story-grid');grid.innerHTML='';
  Object.entries(STORIES).forEach(([id,story])=>{
    const card=document.createElement('div');
    card.className='story-card'+(S.storyId===id?' selected':'');
    card.innerHTML=`<div class="story-icon">${story.icon}</div><div class="story-title">${story.title}</div><div class="story-author">${story.author}</div>`;
    card.addEventListener('click',()=>{
      S.storyId=id;
      document.querySelectorAll('.story-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
    });
    grid.appendChild(card);
  });
}

function refreshMenu(){
  const grid=document.getElementById('scores-grid');grid.innerHTML='';
  const keys=[...Object.keys(STORIES).map(id=>[15,30,60,120].map(d=>`${d}-${id}`)).flat(),
              ...['easy','medium','hard'].map(d=>[15,30,60].map(t=>`${t}-${d}`)).flat()];
  keys.forEach(k=>{
    const b=S.bests[k];if(!b)return;
    const [dur,...rest]=k.split('-');const label=rest.join('-');
    const c=document.createElement('div');c.className='score-card';
    c.innerHTML=`<div class="sc-label">${dur}s · ${label}</div><div class="sc-val">${b.wpm}</div><div class="sc-sub">WPM · ${b.acc}% acc</div>`;
    grid.appendChild(c);
  });
  if(!grid.children.length) grid.innerHTML='<p style="color:var(--text-dim);font-size:.82rem;text-align:center;width:100%">No records yet — play a game!</p>';
  drawSparkline();
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
// Mode tabs
document.querySelectorAll('.mode-tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    S.gameMode=btn.dataset.mode;
    document.getElementById('words-panel').classList.toggle('hidden',S.gameMode==='story');
    document.getElementById('story-panel').classList.toggle('visible',S.gameMode==='story');
  });
});

// Duration (words)
document.getElementById('duration-opts').addEventListener('click',e=>{
  const b=e.target.closest('.opt-btn');if(!b)return;
  document.querySelectorAll('#duration-opts .opt-btn').forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected');S.duration=parseInt(b.dataset.val);
});
// Duration (stories)
document.getElementById('story-duration-opts').addEventListener('click',e=>{
  const b=e.target.closest('.opt-btn');if(!b)return;
  document.querySelectorAll('#story-duration-opts .opt-btn').forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected');S.duration=parseInt(b.dataset.val);
});
// Difficulty
document.getElementById('difficulty-opts').addEventListener('click',e=>{
  const b=e.target.closest('.opt-btn');if(!b)return;
  document.querySelectorAll('#difficulty-opts .opt-btn').forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected');S.difficulty=b.dataset.val;
});
// Toggles
function setupToggle(id,key){
  const b=document.getElementById(id);
  b.addEventListener('click',()=>{S[key]=!S[key];b.classList.toggle('on',S[key]);savePersisted();});
  b.classList.toggle('on',S[key]);
}
setupToggle('numbers-btn','useNumbers');
setupToggle('punct-btn','usePunctuation');
setupToggle('strict-btn','stopOnError');

document.getElementById('play-btn').addEventListener('click',()=>{showScreen('game');initGame();});
document.getElementById('retry-btn').addEventListener('click',()=>initGame());
document.getElementById('menu-btn').addEventListener('click',()=>{showScreen('menu');refreshMenu();});
document.getElementById('restart-btn').addEventListener('click',()=>initGame());
document.getElementById('focus-overlay').addEventListener('click',()=>{
  if(S.afkPaused){resumeAfk();}else{hideOverlay();}
  hiddenInput.focus();
});

// Global keyboard
document.addEventListener('keydown',e=>{
  if(S.screen==='game'&&S.finished){
    if(e.key==='Tab'||e.key==='Enter'){e.preventDefault();initGame();}
    if(e.key==='Escape'){showScreen('menu');refreshMenu();}
  }
  if(S.screen==='game'&&document.activeElement!==hiddenInput&&!S.finished){
    hiddenInput.focus();
  }
});
wordArea.addEventListener('click',()=>hiddenInput.focus());

// Focus/blur for overlay
hiddenInput.addEventListener('blur',()=>{
  if(S.started&&!S.finished&&!S.afkPaused){
    setTimeout(()=>{
      if(document.activeElement!==hiddenInput&&S.started&&!S.finished){
        showOverlay('⌨️','Click to focus');
      }
    },200);
  }
});
hiddenInput.addEventListener('focus',()=>{
  if(!S.afkPaused)hideOverlay();
});

// Theme
document.getElementById('theme-btn').addEventListener('click',()=>{
  S.theme=S.theme==='dark'?'light':'dark';
  document.body.dataset.theme=S.theme;
  document.getElementById('theme-btn').textContent=S.theme==='dark'?'☀️':'🌙';
  savePersisted();
});
// Sound
document.getElementById('sound-btn').addEventListener('click',()=>{
  S.soundOn=!S.soundOn;
  const b=document.getElementById('sound-btn');
  b.textContent=S.soundOn?'🔊':'🔇';b.classList.toggle('active',S.soundOn);
  savePersisted();
});

// ── INIT ──────────────────────────────────────────────────────────────────────
loadPersisted();
updateLevelBar();
document.body.dataset.theme=S.theme;
document.getElementById('theme-btn').textContent=S.theme==='dark'?'☀️':'🌙';
document.getElementById('sound-btn').textContent=S.soundOn?'🔊':'🔇';
document.getElementById('sound-btn').classList.toggle('active',S.soundOn);
['numbers-btn','punct-btn','strict-btn'].forEach(id=>{
  const key=id==='numbers-btn'?'useNumbers':id==='punct-btn'?'usePunctuation':'stopOnError';
  document.getElementById(id).classList.toggle('on',S[key]);
});
buildStoryGrid();
refreshMenu();
</script>
