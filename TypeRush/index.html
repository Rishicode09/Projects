<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeRush — Type Faster</title>
<style>
  :root {
    --bg: #0f0f13;
    --bg2: #1a1a24;
    --bg3: #24243a;
    --text: #e0e0f0;
    --text-dim: #6b6b8a;
    --accent: #7c5cbf;
    --accent2: #a87cff;
    --accent3: #ff6b9d;
    --correct: #4ecca3;
    --wrong: #ff5577;
    --caret: #fff;
    --card: #1f1f2e;
    --border: #2d2d45;
    --glow: rgba(168,124,255,0.35);
    --radius: 12px;
    --line-h: 2.15rem;
    --word-gap: 10px;
  }
  [data-theme="light"] {
    --bg: #f0f0f8; --bg2: #e2e2f0; --bg3: #d0d0e8;
    --text: #1a1a2e; --text-dim: #7070a0;
    --accent: #6040b0; --accent2: #8060d0; --accent3: #d04080;
    --correct: #1a9a70; --wrong: #cc2244; --caret: #1a1a2e;
    --card: #e8e8f8; --border: #c0c0e0; --glow: rgba(96,64,176,0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg); color: var(--text);
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }

  #bg-canvas   { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  #particle-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 999; }

  /* ── NAV ── */
  nav {
    width: 100%; max-width: 860px; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 2;
  }
  .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent2); letter-spacing: -0.5px; }
  .logo span { color: var(--accent3); }
  .nav-btns { display: flex; gap: 10px; align-items: center; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 8px; padding: 7px 12px;
    cursor: pointer; font-size: 1rem; transition: all 0.2s;
  }
  .icon-btn:hover { color: var(--accent2); border-color: var(--accent2); }
  .icon-btn.active { color: var(--accent2); border-color: var(--accent2); }

  /* ── LEVEL BAR ── */
  #level-bar-wrap {
    width: 100%; max-width: 860px; padding: 0 24px 8px;
    display: flex; align-items: center; gap: 10px;
    font-size: 0.78rem; color: var(--text-dim);
    position: relative; z-index: 2;
  }
  #level-label { font-weight: 700; color: var(--accent2); min-width: 60px; }
  .bar-track { flex: 1; height: 6px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
  #level-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px; width: 0%; transition: width 0.6s ease;
  }
  #xp-label { min-width: 80px; text-align: right; }

  /* ── SCREENS ── */
  .screen {
    display: none; width: 100%; max-width: 860px;
    padding: 0 24px 40px;
    position: relative; z-index: 2;
  }
  .screen.active { display: block; }

  /* ── MENU ── */
  #menu-screen { text-align: center; }
  .menu-title {
    font-size: 3rem; font-weight: 700; margin-bottom: 6px;
    background: linear-gradient(135deg, var(--accent2), var(--accent3));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .menu-sub { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 32px; }

  .option-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .option-label {
    display: block; color: var(--text-dim);
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
  }
  .opt-btn {
    background: var(--card); border: 2px solid var(--border);
    color: var(--text-dim); border-radius: 8px; padding: 8px 20px;
    cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: 600;
    transition: all 0.2s;
  }
  .opt-btn:hover { border-color: var(--accent); color: var(--text); }
  .opt-btn.selected {
    border-color: var(--accent2); color: var(--accent2);
    background: var(--bg3); box-shadow: 0 0 12px var(--glow);
  }
  .opt-btn.toggle.on {
    border-color: var(--accent3); color: var(--accent3);
    background: var(--bg3);
  }

  #play-btn {
    display: block; margin: 8px auto 28px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: #fff; font-family: inherit;
    font-size: 1.1rem; font-weight: 700; letter-spacing: 1px;
    padding: 14px 48px; border-radius: 10px; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(124,92,191,0.4);
  }
  #play-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(124,92,191,0.55); }
  #play-btn:active { transform: translateY(0); }

  .scores-grid { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  .score-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 20px; min-width: 120px; text-align: center;
  }
  .score-card .sc-label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .score-card .sc-val { font-size: 1.5rem; font-weight: 700; color: var(--accent2); margin: 4px 0 2px; }
  .score-card .sc-sub { font-size: 0.78rem; color: var(--text-dim); }

  /* ── GAME: LIVE AREA ── */
  #game-live { transition: opacity 0.3s ease; }
  #game-live.fading { opacity: 0; pointer-events: none; }

  .hud {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0 16px; flex-wrap: wrap; gap: 10px;
  }
  .hud-stat { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
  .hud-val { font-size: 1.8rem; font-weight: 700; color: var(--accent2); line-height: 1; }
  .hud-label { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .hud-sub { font-size: 0.65rem; color: var(--text-dim); margin-top: 1px; }

  /* timer ring */
  #timer-ring-wrap { position: relative; width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; }
  #timer-ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  #timer-ring circle { fill: none; }
  #timer-bg { stroke: var(--bg3); stroke-width: 5; }
  #timer-arc { stroke: var(--accent2); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  #timer-text { font-size: 1.4rem; font-weight: 700; color: var(--accent2); z-index: 1; }

  /* combo */
  #combo-area { text-align: center; margin-bottom: 8px; }
  #combo-label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  #combo-val { font-size: 2rem; font-weight: 700; color: var(--accent3); display: inline-block; }
  #combo-val.pop { animation: comboPop 0.2s ease; }
  @keyframes comboPop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  .combo-bar-track { width: 100%; height: 4px; background: var(--bg3); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  #combo-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent3), #ffaa44); border-radius: 99px; width: 0%; transition: width 0.3s ease; }

  /* ── 3-ROW WORD DISPLAY ── */
  #word-area {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
    /* exactly 3 rows visible: 3×line-height + 2×row-gap + top/bottom padding */
    height: calc(3 * var(--line-h) + 2 * var(--word-gap) + 40px);
    overflow: hidden;
    position: relative;
    margin-bottom: 12px;
    transition: box-shadow 0.3s;
    cursor: text;
  }
  #word-area.glow { box-shadow: 0 0 30px var(--glow); }
  #word-area.shake { animation: shake 0.25s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-6px); }
    40%     { transform: translateX(6px); }
    60%     { transform: translateX(-4px); }
    80%     { transform: translateX(4px); }
  }

  #words-container {
    font-size: 1.5rem;
    line-height: var(--line-h);
    user-select: none;
    display: flex; flex-wrap: wrap;
    gap: var(--word-gap) 10px;
    will-change: transform;
    transition: transform 0.25s ease;
  }
  .word { display: flex; position: relative; }

  /* word-level error highlight in strict mode */
  .word.strict-error::after {
    content: '';
    position: absolute; inset: -2px; border-radius: 4px;
    border: 2px solid var(--wrong);
    pointer-events: none;
  }

  .char {
    color: var(--text-dim);
    position: relative;
    transition: color 0.06s;
  }
  .char.correct { color: var(--correct); }
  .char.wrong   { color: var(--wrong); }
  .char.caret::before {
    content: '';
    position: absolute; left: -1px; top: 3px; bottom: 3px;
    width: 2px; background: var(--caret); border-radius: 1px;
    animation: caretBlink 1s steps(1) infinite;
  }
  @keyframes caretBlink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }

  #hidden-input { position: absolute; left: -9999px; top: 0; opacity: 0; pointer-events: none; }

  #restart-hint { text-align: center; font-size: 0.78rem; color: var(--text-dim); margin-top: 6px; }
  kbd { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-family: inherit; font-size: 0.78rem; }

  /* strict-mode notice bar */
  #strict-notice {
    display: none; text-align: center; font-size: 0.75rem;
    color: var(--accent3); margin-bottom: 6px; letter-spacing: 0.5px;
  }
  #strict-notice.visible { display: block; }

  /* ── INLINE RESULTS ── */
  #game-results {
    display: none;
  }
  #game-results.show {
    display: block;
    animation: resultsIn 0.4s ease forwards;
  }
  @keyframes resultsIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .results-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 20px; color: var(--accent2); }
  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px; margin-bottom: 20px;
  }
  .result-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
  .result-card .r-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .result-card .r-val { font-size: 1.9rem; font-weight: 700; color: var(--accent2); margin: 4px 0 0; }
  .result-card .r-unit { font-size: 0.75rem; color: var(--text-dim); }
  .result-card.highlight { border-color: var(--accent2); box-shadow: 0 0 16px var(--glow); }

  #chart-canvas {
    width: 100%; height: 160px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; display: block; margin-bottom: 16px;
  }
  .trouble-section { margin-bottom: 20px; }
  .trouble-section h3 { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  #trouble-keys { display: flex; flex-wrap: wrap; gap: 8px; }
  .tkey { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; text-align: center; }
  .tkey .tk-char { font-size: 1.1rem; font-weight: 700; color: var(--wrong); }
  .tkey .tk-count { font-size: 0.65rem; color: var(--text-dim); margin-top: 2px; }

  .results-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .action-btn {
    flex: 1; min-width: 120px; padding: 12px 24px; border-radius: 10px;
    font-family: inherit; font-size: 0.95rem; font-weight: 700;
    cursor: pointer; border: 2px solid var(--accent); transition: all 0.2s;
  }
  .action-btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent; color: #fff;
    box-shadow: 0 4px 16px rgba(124,92,191,0.4);
  }
  .action-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124,92,191,0.55); }
  .action-btn.secondary { background: transparent; color: var(--text-dim); }
  .action-btn.secondary:hover { border-color: var(--accent2); color: var(--text); }

  /* ── TOASTS ── */
  #toast-area {
    position: fixed; top: 20px; right: 20px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 1000; pointer-events: none;
    width: min(360px, calc(100vw - 40px));
  }
  .toast {
    background: var(--card); border: 1px solid var(--accent);
    border-radius: 10px; padding: 12px 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
    display: flex; align-items: center; gap: 10px;
  }
  @keyframes toastIn  { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: translateX(0); } }
  @keyframes toastOut { from { opacity:1; } to { opacity:0; } }
  .toast-icon { font-size: 1.4rem; }
  .toast-title { font-weight: 700; color: var(--accent2); }
  .toast-sub { color: var(--text-dim); font-size: 0.78rem; }

  /* ── LEVEL-UP FLASH ── */
  #levelup-flash {
    position: fixed; inset: 0; z-index: 998;
    background: radial-gradient(ellipse at center, rgba(168,124,255,0.3), transparent 70%);
    pointer-events: none; opacity: 0; transition: opacity 0.3s;
  }
  #levelup-flash.show { opacity: 1; }

  body.milestone { animation: milestoneBody 0.6s ease; }
  @keyframes milestoneBody {
    0%,100% { background: var(--bg); }
    50%     { background: color-mix(in srgb, var(--bg) 80%, var(--accent2)); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    #words-container { font-size: 1.2rem; }
    .menu-title { font-size: 2.2rem; }
    .hud-val { font-size: 1.4rem; }
    #word-area { height: calc(3 * 1.9rem + 2 * var(--word-gap) + 40px); }
  }
</style>
</head>
<body data-theme="dark">

<canvas id="bg-canvas"></canvas>
<canvas id="particle-canvas"></canvas>
<div id="levelup-flash"></div>
<div id="toast-area"></div>

<nav>
  <div class="logo">Type<span>Rush</span></div>
  <div class="nav-btns">
    <button class="icon-btn" id="theme-btn" title="Toggle theme">☀️</button>
    <button class="icon-btn active" id="sound-btn" title="Toggle sound">🔊</button>
  </div>
</nav>

<div id="level-bar-wrap">
  <span id="level-label">Lvl 1</span>
  <div class="bar-track"><div id="level-fill"></div></div>
  <span id="xp-label">0 XP</span>
</div>

<!-- ══ MENU ══ -->
<div id="menu-screen" class="screen active">
  <div class="menu-title">TypeRush</div>
  <div class="menu-sub">Train your fingers. Break your records.</div>

  <span class="option-label">Duration</span>
  <div class="option-row" id="duration-opts">
    <button class="opt-btn selected" data-val="15">15s</button>
    <button class="opt-btn" data-val="30">30s</button>
    <button class="opt-btn" data-val="60">60s</button>
  </div>

  <span class="option-label">Difficulty</span>
  <div class="option-row" id="difficulty-opts">
    <button class="opt-btn selected" data-val="easy">Easy</button>
    <button class="opt-btn" data-val="medium">Medium</button>
    <button class="opt-btn" data-val="hard">Hard</button>
  </div>

  <span class="option-label">Modifiers</span>
  <div class="option-row">
    <button class="opt-btn toggle" id="numbers-btn">123 Numbers</button>
    <button class="opt-btn toggle" id="punct-btn">., Punctuation</button>
    <button class="opt-btn toggle" id="strict-btn">⚠ Strict Mode</button>
  </div>

  <button id="play-btn">▶  PLAY</button>

  <span class="option-label" style="display:block;text-align:center;margin-bottom:12px;">Personal Bests</span>
  <div class="scores-grid" id="scores-grid"></div>
</div>

<!-- ══ GAME ══ -->
<div id="game-screen" class="screen">

  <!-- live typing area -->
  <div id="game-live">
    <div class="hud">
      <div class="hud-stat">
        <span class="hud-val" id="wpm-val">0</span>
        <span class="hud-sub" id="raw-wpm-sub">raw 0</span>
        <span class="hud-label">WPM</span>
      </div>
      <div class="hud-stat">
        <span class="hud-val" id="acc-val">100</span>
        <span class="hud-label">Accuracy %</span>
      </div>
      <div id="timer-ring-wrap">
        <svg id="timer-ring" viewBox="0 0 72 72">
          <circle id="timer-bg" cx="36" cy="36" r="31"/>
          <circle id="timer-arc" cx="36" cy="36" r="31"
            stroke-dasharray="194.78" stroke-dashoffset="0"/>
        </svg>
        <span id="timer-text">--</span>
      </div>
      <div class="hud-stat">
        <span class="hud-val" id="score-val">0</span>
        <span class="hud-label">Score</span>
      </div>
      <div class="hud-stat">
        <span class="hud-val" id="chars-val">0</span>
        <span class="hud-label">Chars</span>
      </div>
    </div>

    <div id="combo-area">
      <div id="combo-label">Combo</div>
      <div id="combo-val">×1</div>
      <div class="combo-bar-track"><div id="combo-bar-fill"></div></div>
    </div>

    <div id="strict-notice">⚠ Strict mode — fix the word before pressing space</div>

    <div id="word-area">
      <div id="words-container"></div>
      <input id="hidden-input" type="text" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <div id="restart-hint"><kbd>Tab</kbd> restart &nbsp;·&nbsp; <kbd>Esc</kbd> menu</div>
  </div>

  <!-- inline results (replaces live area) -->
  <div id="game-results">
    <div class="results-title" id="results-headline">Results</div>
    <div class="results-grid" id="results-grid"></div>
    <canvas id="chart-canvas"></canvas>
    <div class="trouble-section">
      <h3>Trouble Keys</h3>
      <div id="trouble-keys"></div>
    </div>
    <div class="results-actions">
      <button class="action-btn primary" id="retry-btn">↻  Retry</button>
      <button class="action-btn secondary" id="menu-btn">⌂  Menu</button>
    </div>
  </div>

</div><!-- /game-screen -->

<script>
// ── WORD LISTS ────────────────────────────────────────────────────────────────
const EASY_WORDS = `the be to of and a in that have it for not on with he as you do at this but his by from they we say her she or an will my one all would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some could them see other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us`.split(' ');

const MEDIUM_WORDS_RAW = `The quick brown fox jumped over the lazy dog She said nothing but smiled slowly He walked away without looking back The door creaked open in the silence They found the answer hidden in plain sight Every morning brings a chance to begin It felt like the right thing to do Nothing moved except the curtains in the wind She picked up the pen and started writing He could not explain what happened next`.split(' ');

const HARD_WORDS = [
  'acquiesce','ambiguous','anachronism','anecdote','annihilate',
  'anonymous','antithesis','apparatus','arbitrary','archipelago',
  'arduous','aristocratic','assiduous','atrocious','audacious',
  'belligerent','benevolent','bibliography','bureaucracy','cacophony',
  'camaraderie','catastrophic','charismatic','circumlocution','clandestine',
  'colloquial','colossal','commemorate','compassionate','conscientious',
  'conspicuous','contemptuous','contentious','controversial','convivial',
  'corroborate','cumbersome','deferential','deleterious','demagogue',
  'desiccated','despondent','dilapidated','diligent','discernible',
  'dissonance','duplicitous','eccentric','eloquent','embellishment',
  'ephemeral','equivocal','exacerbate','exasperated','exuberant',
  'facetious','fallacious','fastidious','ferocious','flabbergasted',
  'flourishing','fortuitous','fraudulent','gregarious','grotesque',
  'guerrilla','harrowing','heinous','hierarchy','hypocritical',
  'idiosyncratic','ignominious','illusory','immaculate','impeccable',
  'imperceptible','implausible','incorrigible','indisputable','ineffable',
  'inevitable','inquisitive','inscrutable','insidious','insurmountable',
  'integrity','intermittent','labyrinthine','lachrymose','languorous',
  'lethargic','liaison','lugubrious','magnanimous','malevolent',
  'malicious','melancholy','meticulous','millennium','miscellaneous',
  'mnemonic','munificent','mysterious','nefarious','obstreperous',
  'ominous','onomatopoeia','oppressive','ostentatious','overwhelmed',
  'painstaking','pandemonium','paradoxical','passionate','pejorative',
  'pernicious','perseverance','perspicacious','pertinacious','philanthropy',
  'picturesque','preposterous','pretentious','procrastinate','prodigious',
  'proficient','prophecy','punctilious','quarrelsome','querulous',
  'quintessential','rambunctious','rapturous','recalcitrant','reckless',
  'relentless','reminiscent','reprehensible','resilient','rhapsodize',
  'righteous','scrupulous','serendipitous','silhouette','simultaneous',
  'soliloquy','sophisticated','spontaneous','supercilious','surreptitious',
  'susceptible','temperamental','treacherous','tumultuous','ubiquitous',
  'unconscionable','unequivocal','unprecedented','unscrupulous','vacillate',
  'vehement','venomous','vicarious','vivacious','vulnerability','whimsical','zealous',
];

const MEDIUM_WORDS = EASY_WORDS
  .map((w, i) => i % 5 === 0 ? w[0].toUpperCase() + w.slice(1) : w)
  .concat(MEDIUM_WORDS_RAW);

function getWordList(diff) {
  if (diff === 'easy')   return EASY_WORDS;
  if (diff === 'medium') return MEDIUM_WORDS;
  return HARD_WORDS;
}

// ── AUDIO ─────────────────────────────────────────────────────────────────────
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playClick(type = 'key') {
  if (!STATE.soundOn) return;
  try {
    const ctx = getAudioCtx();
    if (type === 'levelup') {
      [500,650,800].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f;
        o.start(ctx.currentTime + i*0.1);
        o.stop(ctx.currentTime + i*0.1 + 0.15);
        g.gain.setValueAtTime(0.08, ctx.currentTime + i*0.1);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.1 + 0.15);
      });
      return;
    }
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    const cfg = {
      key:   { f:600, t:'sine',     v:0.06, d:0.05 },
      error: { f:200, t:'sawtooth', v:0.08, d:0.1  },
      word:  { f:900, t:'sine',     v:0.05, d:0.08  },
    }[type] || { f:600, t:'sine', v:0.06, d:0.05 };
    osc.frequency.value = cfg.f; osc.type = cfg.t;
    gain.gain.setValueAtTime(cfg.v, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + cfg.d);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + cfg.d);
  } catch(e) {}
}

// ── BACKGROUND ORBS ───────────────────────────────────────────────────────────
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx    = bgCanvas.getContext('2d');
let bgOrbs = [];

function resizeBgCanvas() { bgCanvas.width = innerWidth; bgCanvas.height = innerHeight; }
window.addEventListener('resize', resizeBgCanvas);
resizeBgCanvas();

function initBgOrbs() {
  bgOrbs = Array.from({length: 18}, () => ({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    r: 80 + Math.random() * 130,
    opacity: 0.05 + Math.random() * 0.09,
    colorIdx: Math.floor(Math.random() * 3),
    phase: Math.random() * Math.PI * 2,
    phaseSpeed: 0.005 + Math.random() * 0.01,
  }));
}
initBgOrbs();

function drawBgOrbs() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  const dark = document.body.dataset.theme === 'dark';
  const cols = dark
    ? ['168,124,255','255,107,157','78,204,163']
    : ['96,64,176','208,64,128','26,154,112'];
  for (const orb of bgOrbs) {
    orb.x += orb.vx; orb.y += orb.vy; orb.phase += orb.phaseSpeed;
    if (orb.x < -orb.r) orb.x = bgCanvas.width  + orb.r;
    if (orb.x > bgCanvas.width  + orb.r) orb.x = -orb.r;
    if (orb.y < -orb.r) orb.y = bgCanvas.height + orb.r;
    if (orb.y > bgCanvas.height + orb.r) orb.y = -orb.r;
    const r = orb.r * (1 + 0.12 * Math.sin(orb.phase));
    const g = bgCtx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, r);
    g.addColorStop(0, `rgba(${cols[orb.colorIdx]},${orb.opacity})`);
    g.addColorStop(1, `rgba(${cols[orb.colorIdx]},0)`);
    bgCtx.beginPath(); bgCtx.arc(orb.x, orb.y, r, 0, Math.PI*2);
    bgCtx.fillStyle = g; bgCtx.fill();
  }
}

// ── PARTICLES ─────────────────────────────────────────────────────────────────
const pCanvas = document.getElementById('particle-canvas');
const pCtx    = pCanvas.getContext('2d');
let particles = [];

function resizePCanvas() { pCanvas.width = innerWidth; pCanvas.height = innerHeight; }
window.addEventListener('resize', resizePCanvas);
resizePCanvas();

function spawnParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 1, decay: 0.03 + Math.random()*0.04, r: 3 + Math.random()*3, color });
  }
}

function animateFrame() {
  drawBgOrbs();
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= p.decay;
    pCtx.globalAlpha = p.life;
    pCtx.fillStyle = p.color;
    pCtx.beginPath(); pCtx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2); pCtx.fill();
  }
  pCtx.globalAlpha = 1;
  requestAnimationFrame(animateFrame);
}
animateFrame();

function awardXP(amount) {
  STATE.xp += amount;
  let leveled = false;
  while (STATE.xp >= xpForLevel(STATE.level)) {
    STATE.xp -= xpForLevel(STATE.level); STATE.level++; leveled = true;
  }
  if (leveled) {
    playClick('levelup');
    showToast('⚡', `Level Up! You're now Level ${STATE.level}`, 'Keep going!');
    const f = document.getElementById('levelup-flash');
    f.classList.add('show'); setTimeout(() => f.classList.remove('show'), 600);

}

  document.getElementById('level-fill').style.width = Math.min(100, (STATE.xp / needed) * 100) + '%';

// ── WORD GENERATION ───────────────────────────────────────────────────────────
function generateWords(count, recentSeed = []) {
  const list = getWordList(STATE.difficulty);
  const words = [];
  const windowSize = Math.min(8, Math.floor(list.length / 2));
  const recent = recentSeed.slice(-windowSize);

  for (let i = 0; i < count; i++) {
    let base, attempts = 0;
    do {
      base = list[Math.floor(Math.random() * list.length)];
      attempts++;
    } while (recent.includes(base) && attempts < 30);

    let word = base;
    if (STATE.useNumbers && Math.random() < 0.12) {
      word = String(Math.floor(Math.random() * 900) + 100);
    } else if (STATE.usePunctuation && Math.random() < 0.28) {
      word = base + (Math.random() < 0.6 ? ',' : '.');
    }

    words.push(word);
    recent.push(base);
    if (recent.length > windowSize) recent.shift();
  }
  return words;
}

// ── WORD DOM ──────────────────────────────────────────────────────────────────
const wordsContainer = document.getElementById('words-container');
const wordArea = document.getElementById('word-area');
const hiddenInput = document.getElementById('hidden-input');

function makeWordEl(word, wi) {
  const el = document.createElement('span');
  el.className = 'word'; el.dataset.wi = wi;
  word.split('').forEach(ch => {
    const s = document.createElement('span');
    s.className = 'char'; s.textContent = ch;
    el.appendChild(s);
  });
  return el;
}

function buildWordDom() {
  wordsContainer.innerHTML = '';
  STATE.words.forEach((w, i) => wordsContainer.appendChild(makeWordEl(w, i)));
  updateCaret();
}

function getWordEl(wi) { return wordsContainer.querySelector(`.word[data-wi="${wi}"]`); }

function updateCaret() {
  document.querySelectorAll('.char.caret').forEach(e => e.classList.remove('caret'));
  const wordEl = getWordEl(STATE.wordIndex);
  if (!wordEl) return;
  const chars = wordEl.querySelectorAll('.char');
  const target = chars[STATE.charIndex] || chars[chars.length - 1];
  if (target) target.classList.add('caret');
}

// ── 3-ROW SCROLL ──────────────────────────────────────────────────────────────
function getRowHeight() {
  // Find the offsetTop of the first word that wrapped to a new row
  const allWords = wordsContainer.querySelectorAll('.word');
  for (const w of allWords) {
    if (w.offsetTop > 0) return w.offsetTop;
  }
  return null; // all on one line (shouldn't happen with enough words)
}

function scrollWordDisplay() {
  const currentWordEl = getWordEl(STATE.wordIndex);
  if (!currentWordEl) return;
  const lineH = getRowHeight();
  if (!lineH) return;

  // Which row (0-indexed) is the current word on?
  const currentRow = Math.round(currentWordEl.offsetTop / lineH);
  // Keep current word on row 1 (centre of 3 visible rows)
  const scrollRows = Math.max(0, currentRow - 1);
  wordsContainer.style.transform = `translateY(-${scrollRows * lineH}px)`;
}

// ── GAME FLOW ─────────────────────────────────────────────────────────────────
function initGame() {
  STATE.started = false; STATE.finished = false;
  STATE.timeLeft = STATE.duration;
  STATE.wordIndex = 0; STATE.charIndex = 0;
  STATE.typedChars = Array(1000).fill('');
  STATE.correctChars = 0; STATE.rawChars = 0; STATE.totalTyped = 0;
  STATE.combo = 0; STATE.maxCombo = 0; STATE.score = 0;
  STATE.wpmSamples = []; STATE.perKeyErrors = {};

  clearInterval(STATE.timerId); STATE.timerId = null;

  STATE.words = generateWords(200);
  buildWordDom();
  wordsContainer.style.transform = '';

  updateHUD();
  updateCombo();
  setTimerRing(STATE.duration, STATE.duration);

  // reset inline result panels
  const live = document.getElementById('game-live');
  const results = document.getElementById('game-results');
  live.classList.remove('fading'); live.style.display = '';
  results.classList.remove('show');

  document.querySelectorAll('.word.strict-error').forEach(e => e.classList.remove('strict-error'));

  hiddenInput.value = '';
  hiddenInput.focus();
  wordArea.classList.remove('glow', 'shake');

  // show strict notice
  document.getElementById('strict-notice').classList.toggle('visible', STATE.stopOnError);
}

function startTimer() {
  STATE.started = true;
  STATE.timerId = setInterval(() => {
    STATE.timeLeft--;
    updateHUD();
    setTimerRing(STATE.timeLeft, STATE.duration);
    const elapsed = STATE.duration - STATE.timeLeft;
    if (elapsed > 0) {
      const wpm = Math.round((STATE.correctChars / 5) / (elapsed / 60));
      STATE.wpmSamples.push({ t: elapsed, wpm });
    }
    if (STATE.timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  clearInterval(STATE.timerId);
  STATE.finished = true;

  const elapsed = STATE.duration;
  const wpm     = Math.round((STATE.correctChars / 5) / (elapsed / 60));
  const rawWpm  = Math.round((STATE.rawChars / 5) / (elapsed / 60));
  const accuracy = STATE.totalTyped > 0
    ? Math.round((STATE.correctChars / STATE.totalTyped) * 100) : 100;

  const bestKey = `${STATE.duration}-${STATE.difficulty}`;
  const isNewRecord = !STATE.bests[bestKey] || wpm > STATE.bests[bestKey].wpm;
  if (isNewRecord) STATE.bests[bestKey] = { wpm, acc: accuracy, score: STATE.score };

  STATE.totalRuns++;
  const xpGained = Math.round(STATE.score / 10) + wpm * 2;
  awardXP(xpGained);
  checkAchievements({ wpm, accuracy, maxCombo: STATE.maxCombo });
  savePersisted();

  showResultsInline({ wpm, rawWpm, accuracy, isNewRecord, xpGained });
}

// ── INPUT HANDLING ────────────────────────────────────────────────────────────
hiddenInput.addEventListener('keydown', e => {
  if (STATE.finished) return;
  if (e.key === 'Tab') { e.preventDefault(); initGame(); return; }
  if (e.key === 'Escape') {
    e.preventDefault(); clearInterval(STATE.timerId);
    showScreen('menu'); refreshMenuScores(); return;
  }
  if (!STATE.started && e.key.length === 1) startTimer();
});

hiddenInput.addEventListener('input', () => {
  if (STATE.finished) return;

  const val = hiddenInput.value;
  const currentWord = STATE.words[STATE.wordIndex];

  // track raw characters typed
  const prevLen = (STATE.typedChars[STATE.wordIndex] || '').length;
  const newLen  = val.endsWith(' ') ? val.length - 1 : val.length;
  if (newLen > prevLen) STATE.rawChars += (newLen - prevLen);

  // space = submit word
  if (val.endsWith(' ')) {
    const typed = val.trimEnd();

    // strict mode: block advancing on wrong word
    if (STATE.stopOnError && typed !== currentWord) {
      hiddenInput.value = typed; // remove the space, keep text
      wordArea.classList.add('shake');
      playClick('error');
      const wordEl = getWordEl(STATE.wordIndex);
      if (wordEl) wordEl.classList.add('strict-error');
      setTimeout(() => wordArea.classList.remove('shake'), 300);
      return;
    }

    // remove strict-error highlight on submission
    const wordEl = getWordEl(STATE.wordIndex);
    if (wordEl) wordEl.classList.remove('strict-error');

    submitWord(typed);
    hiddenInput.value = '';
    return;
  }

  // live char coloring
  STATE.typedChars[STATE.wordIndex] = val;
  STATE.charIndex = val.length;

  const wordEl = getWordEl(STATE.wordIndex);
  if (!wordEl) return;
  wordEl.querySelectorAll('.char').forEach((ch, ci) => {
    ch.classList.remove('correct', 'wrong', 'caret');
    if (ci < val.length) {
      const correct = val[ci] === currentWord[ci];
      ch.classList.add(correct ? 'correct' : 'wrong');
      if (!correct && val[ci] !== undefined) {
        STATE.perKeyErrors[currentWord[ci]] = (STATE.perKeyErrors[currentWord[ci]] || 0) + 1;
      }
    }
  });

  updateCaret();
  playClick('key');
});

// ── WORD SUBMISSION ───────────────────────────────────────────────────────────
function submitWord(typed) {
  const expected = STATE.words[STATE.wordIndex];
  const isCorrect = typed === expected;
  STATE.totalTyped += typed.length;

  if (isCorrect) {
    STATE.correctChars += expected.length + 1; // +1 for space
    STATE.combo++;
    if (STATE.combo > STATE.maxCombo) STATE.maxCombo = STATE.combo;
    const mult = comboMultiplier();
    STATE.score += expected.length * mult * 10;
    playClick('word');

    const wordEl = getWordEl(STATE.wordIndex);
    if (wordEl) {
      const r = wordEl.getBoundingClientRect();
      spawnParticles(r.left + r.width/2, r.top + r.height/2, '#4ecca3');
      spawnParticles(r.left + r.width/2, r.top + r.height/2, '#a87cff');
    }

    if ([10,25,50,100].includes(STATE.combo)) {
      wordArea.classList.add('glow');
      document.body.classList.add('milestone');
      showToast('🔥', `${STATE.combo}× Combo!`, `Multiplier ×${mult.toFixed(1)}`);
      setTimeout(() => { wordArea.classList.remove('glow'); document.body.classList.remove('milestone'); }, 1000);
    }
  } else {
    for (let i = 0; i < expected.length; i++) {
      if ((typed[i] || '') !== expected[i])
        STATE.perKeyErrors[expected[i]] = (STATE.perKeyErrors[expected[i]] || 0) + 1;
    }
    STATE.combo = 0;
    wordArea.classList.add('shake');
    setTimeout(() => wordArea.classList.remove('shake'), 300);
    playClick('error');
  }

  // mark word as done
  const wordEl = getWordEl(STATE.wordIndex);
  if (wordEl) {
    wordEl.querySelectorAll('.char').forEach((ch, ci) => {
      ch.classList.remove('correct','wrong','caret');
      if (ci < typed.length)
        ch.classList.add(typed[ci] === expected[ci] ? 'correct' : 'wrong');
    });
  }

  STATE.wordIndex++;
  STATE.charIndex = 0;

  // extend word list
  if (STATE.wordIndex + 20 > STATE.words.length) {
    const extra = generateWords(50, STATE.words.slice(-8));
    const base = STATE.words.length;
    STATE.words.push(...extra);
    extra.forEach((w, i) => wordsContainer.appendChild(makeWordEl(w, base + i)));
  }

  updateCaret();
  updateHUD();
  updateCombo();
  scrollWordDisplay();
}

function comboMultiplier() {
  if (STATE.combo >= 50) return 4;
  if (STATE.combo >= 25) return 3;
  if (STATE.combo >= 10) return 2;
  if (STATE.combo >= 5)  return 1.5;
  return 1;
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD() {
  const elapsed = STATE.duration - STATE.timeLeft;
  const wpm    = elapsed > 0 ? Math.round((STATE.correctChars / 5) / (elapsed / 60)) : 0;
  const rawWpm = elapsed > 0 ? Math.round((STATE.rawChars / 5) / (elapsed / 60)) : 0;
  const acc    = STATE.totalTyped > 0 ? Math.round((STATE.correctChars / STATE.totalTyped) * 100) : 100;

  document.getElementById('wpm-val').textContent     = wpm;
  document.getElementById('raw-wpm-sub').textContent = `raw ${rawWpm}`;
  document.getElementById('acc-val').textContent     = acc;
  document.getElementById('timer-text').textContent  = STATE.timeLeft;
  document.getElementById('score-val').textContent   = STATE.score;
  document.getElementById('chars-val').textContent   = STATE.correctChars;
}

const ARC_LEN = 2 * Math.PI * 31;
function setTimerRing(left, total) {
  const arc = document.getElementById('timer-arc');
  const pct = left / total;
  arc.style.strokeDashoffset = ARC_LEN * (1 - pct);
  arc.style.stroke = pct < 0.25 ? 'var(--accent3)' : pct < 0.5 ? '#ffa84c' : 'var(--accent2)';
}

function updateCombo() {
  const el = document.getElementById('combo-val');
  el.textContent = `×${comboMultiplier().toFixed(1)}`;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  document.getElementById('combo-bar-fill').style.width = Math.min(100, (STATE.combo / 50) * 100) + '%';
}

// ── INLINE RESULTS ────────────────────────────────────────────────────────────
function showResultsInline({ wpm, rawWpm, accuracy, isNewRecord, xpGained }) {
  const live    = document.getElementById('game-live');
  const results = document.getElementById('game-results');

  live.classList.add('fading');

    live.style.display = 'none';

    document.getElementById('results-headline').textContent =
      isNewRecord ? '🏆 New Personal Best!' : 'Results';

    const consistency = calcConsistency();
    const grid = document.getElementById('results-grid');
    grid.innerHTML = '';
    [
      { label:'WPM',         val: wpm,           unit:'words/min', highlight: true },
      { label:'Raw WPM',     val: rawWpm,         unit:'incl. errors' },
      { label:'Accuracy',    val: accuracy,       unit:'%' },
      { label:'Consistency', val: consistency,    unit:'%' },
      { label:'Score',       val: STATE.score,    unit:'pts' },
      { label:'Best Combo',  val: STATE.maxCombo, unit:'words' },
      { label:'XP Gained',   val: xpGained,       unit:'xp' },
    ].forEach(s => {
      const card = document.createElement('div');
      card.className = 'result-card' + (s.highlight ? ' highlight' : '');
      card.innerHTML = `<div class="r-label">${s.label}</div>
        <div class="r-val" data-target="${s.val}">0</div>
        <div class="r-unit">${s.unit}</div>`;
      grid.appendChild(card);
    });

    // count-up
    grid.querySelectorAll('.r-val[data-target]').forEach(el => {
      const target = parseInt(el.dataset.target);
      if (isNaN(target)) return;
      let start = null;
      const step = ts => {
        if (!start) start = ts;
        const p = Math.min((ts - start) / 800, 1);
        el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });

    drawChart();
    renderTroubleKeys();
    results.classList.add('show');
  }, 320);
}

function calcConsistency() {
  if (STATE.wpmSamples.length < 2) return 100;
  const vals = STATE.wpmSamples.map(s => s.wpm);
  const avg  = vals.reduce((a,b) => a+b, 0) / vals.length;
  const sd   = Math.sqrt(vals.reduce((a,b) => a + (b-avg)**2, 0) / vals.length);
  return Math.max(0, Math.round(100 - (sd / (avg||1)) * 100));
}

function drawChart() {
  const canvas = document.getElementById('chart-canvas');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth, H = 160;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const samples = STATE.wpmSamples;
  const pad = { t:16, r:16, b:28, l:42 };
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
  const dark = document.body.dataset.theme === 'dark';

  ctx.fillStyle = dark ? '#1f1f2e' : '#e8e8f8';
  ctx.roundRect(0, 0, W, H, 10); ctx.fill();

  if (samples.length < 2) {
    ctx.fillStyle = dark ? '#6b6b8a' : '#7070a0';
    ctx.font = '13px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('Not enough data', W/2, H/2); return;
  }

  const maxW = Math.max(...samples.map(s=>s.wpm), 1);
  const minW = Math.max(0, Math.min(...samples.map(s=>s.wpm)) - 5);
  const toX  = t => pad.l + (t / STATE.duration) * cw;
  const toY  = w => pad.t + ch - ((w-minW)/(maxW-minW+1)) * ch;

  // grid
  ctx.strokeStyle = dark ? '#2d2d45' : '#c0c0e0'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (ch/4)*i;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l+cw, y); ctx.stroke();
    ctx.fillStyle = dark ? '#6b6b8a' : '#7070a0';
    ctx.font = '10px Courier New'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxW - (maxW-minW)*(i/4)), pad.l-6, y+4);
  }
  [0, STATE.duration/2, STATE.duration].forEach(t => {
    ctx.fillStyle = dark ? '#6b6b8a' : '#7070a0';
    ctx.font = '10px Courier New'; ctx.textAlign = 'center';
    ctx.fillText(t+'s', toX(t), H-8);
  });

  // area
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t+ch);
  grad.addColorStop(0, 'rgba(168,124,255,0.4)'); grad.addColorStop(1, 'rgba(168,124,255,0)');
  ctx.beginPath();
  ctx.moveTo(toX(samples[0].t), toY(samples[0].wpm));
  samples.forEach(s => ctx.lineTo(toX(s.t), toY(s.wpm)));
  ctx.lineTo(toX(samples.at(-1).t), pad.t+ch);
  ctx.lineTo(toX(samples[0].t), pad.t+ch);
  ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

  // line
  ctx.beginPath();
  ctx.moveTo(toX(samples[0].t), toY(samples[0].wpm));
  samples.forEach(s => ctx.lineTo(toX(s.t), toY(s.wpm)));
  ctx.strokeStyle = '#a87cff'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();

  // dots
  samples.forEach(s => {
    ctx.beginPath(); ctx.arc(toX(s.t), toY(s.wpm), 3, 0, Math.PI*2);
    ctx.fillStyle = '#a87cff'; ctx.fill();
  });
}

function renderTroubleKeys() {
  const container = document.getElementById('trouble-keys');
  container.innerHTML = '';
  const sorted = Object.entries(STATE.perKeyErrors).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if (!sorted.length) {
    container.innerHTML = '<span style="color:var(--correct);font-size:0.9rem;">No trouble keys — great job!</span>';
    return;
  }
  sorted.forEach(([ch, n]) => {
    const el = document.createElement('div'); el.className = 'tkey';
    el.innerHTML = `<div class="tk-char">${ch===' '?'␣':ch}</div><div class="tk-count">${n}×</div>`;
    container.appendChild(el);
  });
}

// ── MENU ──────────────────────────────────────────────────────────────────────
function refreshMenuScores() {
  const grid = document.getElementById('scores-grid');
  grid.innerHTML = '';
  ['easy','medium','hard'].forEach(diff =>
    [15,30,60].forEach(d => {
      const b = STATE.bests[`${d}-${diff}`];
      if (!b) return;
      const card = document.createElement('div');
      card.className = 'score-card';
      card.innerHTML = `<div class="sc-label">${d}s / ${diff}</div>
        <div class="sc-val">${b.wpm}</div><div class="sc-sub">WPM · ${b.acc}% acc</div>`;
      grid.appendChild(card);
    })
  );
  if (!grid.children.length)
    grid.innerHTML = '<p style="color:var(--text-dim);font-size:0.85rem;text-align:center;width:100%">No records yet — play a game!</p>';
}

// ── EVENT LISTENERS ───────────────────────────────────────────────────────────
// duration
document.getElementById('duration-opts').addEventListener('click', e => {
  const btn = e.target.closest('.opt-btn'); if (!btn) return;
  document.querySelectorAll('#duration-opts .opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  STATE.duration = parseInt(btn.dataset.val);
});

// difficulty
document.getElementById('difficulty-opts').addEventListener('click', e => {
  const btn = e.target.closest('.opt-btn'); if (!btn) return;
  document.querySelectorAll('#difficulty-opts .opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  STATE.difficulty = btn.dataset.val;
});

// modifier toggles
function setupToggle(btnId, stateKey) {
  const btn = document.getElementById(btnId);
  const sync = () => btn.classList.toggle('on', STATE[stateKey]);
  btn.addEventListener('click', () => {
    STATE[stateKey] = !STATE[stateKey];
    sync(); savePersisted();
  });
  sync();
}
setupToggle('numbers-btn',   'useNumbers');
setupToggle('punct-btn',     'usePunctuation');
setupToggle('strict-btn',    'stopOnError');

// play
document.getElementById('play-btn').addEventListener('click', () => {
  showScreen('game'); initGame();
});

// results actions
document.getElementById('retry-btn').addEventListener('click', () => initGame());
document.getElementById('menu-btn').addEventListener('click', () => {
  showScreen('menu'); refreshMenuScores();
});

// global keyboard shortcuts
document.addEventListener('keydown', e => {
  if (STATE.screen === 'game' && STATE.finished) {
    if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); initGame(); }
    if (e.key === 'Escape') { showScreen('menu'); refreshMenuScores(); }
  }
  if (STATE.screen === 'game' && document.activeElement !== hiddenInput) hiddenInput.focus();
});

wordArea.addEventListener('click', () => hiddenInput.focus());

// theme
document.getElementById('theme-btn').addEventListener('click', () => {
  STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = STATE.theme;
  document.getElementById('theme-btn').textContent = STATE.theme === 'dark' ? '☀️' : '🌙';
  savePersisted();
});

// sound
document.getElementById('sound-btn').addEventListener('click', () => {
  STATE.soundOn = !STATE.soundOn;
  const btn = document.getElementById('sound-btn');
  btn.textContent = STATE.soundOn ? '🔊' : '🔇';
  btn.classList.toggle('active', STATE.soundOn);
  savePersisted();
});

// ── INIT ──────────────────────────────────────────────────────────────────────
loadPersisted();
updateLevelBar();
document.body.dataset.theme = STATE.theme;
document.getElementById('theme-btn').textContent = STATE.theme === 'dark' ? '☀️' : '🌙';
document.getElementById('sound-btn').textContent = STATE.soundOn ? '🔊' : '🔇';
document.getElementById('sound-btn').classList.toggle('active', STATE.soundOn);
// sync modifier toggle buttons with loaded state
['numbers-btn','punct-btn','strict-btn'].forEach(id => {
  const key = id === 'numbers-btn' ? 'useNumbers' : id === 'punct-btn' ? 'usePunctuation' : 'stopOnError';
  document.getElementById(id).classList.toggle('on', STATE[key]);
});
refreshMenuScores();
</script>
