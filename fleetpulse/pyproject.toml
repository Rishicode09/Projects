[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetpulse"
version = "1.0.0"
description = "Predictive maintenance platform for vehicle fleets: telemetry simulation, ML pipeline, and a production-style inference API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rishi Mehta" }]
keywords = ["automotive", "predictive-maintenance", "machine-learning", "fastapi", "telematics"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
fleetpulse = "fleetpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.isort]
# Declared explicitly so import classification never depends on how the
# package happens to be installed in the environment running the lint.
known-first-party = ["fleetpulse"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
