name: FleetPulse CI

on:
  push:
    branches: [main]
    paths: ["fleetpulse/**", ".github/workflows/fleetpulse-ci.yml"]
  pull_request:
    paths: ["fleetpulse/**", ".github/workflows/fleetpulse-ci.yml"]

defaults:
  run:
    working-directory: fleetpulse

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests with coverage gate
        run: pytest -q --cov=fleetpulse --cov-fail-under=90

  train-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: End-to-end training run
        run: |
          fleetpulse generate --out /tmp/telemetry.csv --vehicles 24 --days 180
          fleetpulse train --data /tmp/telemetry.csv --out /tmp/artifacts
          fleetpulse drift --data /tmp/telemetry.csv
