name: AutoMarket CI

on:
  push:
    paths:
      - "AutoMarket-Intelligence-Platform/**"
      - ".github/workflows/automarket-ci.yml"
  pull_request:
    paths:
      - "AutoMarket-Intelligence-Platform/**"
      - ".github/workflows/automarket-ci.yml"

defaults:
  run:
    working-directory: AutoMarket-Intelligence-Platform

jobs:
  lint:
    name: Lint (black + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: black --check app tests
      - run: ruff check app tests

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m unit --cov --cov-report=term-missing
