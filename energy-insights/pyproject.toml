# pyproject.toml — the modern "ID card" of a Python project.
# It tells pip how to install the package and tells humans what it is.
# `pip install -e .` reads this file; -e ("editable") means your code
# edits take effect immediately without reinstalling.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-insights"
version = "0.1.0"
description = "Household energy data: generation, cleaning, analysis, forecasting"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["energy_insights"]
